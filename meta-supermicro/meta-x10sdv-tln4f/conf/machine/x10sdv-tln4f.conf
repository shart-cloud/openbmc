#@TYPE: Machine
#@NAME: Supermicro X10SDV-TLN4F BMC
#@DESCRIPTION: Supermicro X10SDV-TLN4F (ASPEED AST2400). Modeled on the
#  upstream meta-x11spi (AST2500) Supermicro machine, retargeted to AST2400
#  with the q71l-style g4 u-boot config and our out-of-tree board DTS.

KMACHINE = "aspeed"
KERNEL_DEVICETREE = "aspeed/aspeed-bmc-supermicro-x10sdv-tln4f.dtb"

require conf/machine/include/ast2400.inc
require conf/machine/include/obmc-bsp-common.inc
require conf/machine/include/supermicro.inc

PREFERRED_PROVIDER_virtual/bootloader = "u-boot-aspeed"
PREFERRED_PROVIDER_u-boot = "u-boot-aspeed"
PREFERRED_PROVIDER_u-boot-fw-utils = "u-boot-fw-utils-aspeed"

UBOOT_MACHINE = "ast_g4_ncsi_config"
UBOOT_ENTRYPOINT = "0x40008000"
UBOOT_LOADADDRESS = "0x40008000"

FLASH_SIZE = "32768"

VIRTUAL-RUNTIME_skeleton_workbook = "${MACHINE}-config"

# AST2400 uses BT for in-band IPMI (the DTS enables &ibt). Override
# supermicro.inc's KCS default (weak ?=) like the q71l AST2400 machine.
PREFERRED_PROVIDER_virtual/obmc-host-ipmi-hw = "phosphor-ipmi-bt"
