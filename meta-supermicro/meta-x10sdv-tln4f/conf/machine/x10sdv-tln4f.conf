#@TYPE: Machine
#@NAME: Supermicro X10SDV-TLN4F BMC
#@DESCRIPTION: Supermicro X10SDV-TLN4F (ASPEED AST2400). Modeled on the
#  upstream meta-x11spi (AST2500) Supermicro machine, retargeted to AST2400
#  with the q71l-style g4 u-boot config and our out-of-tree board DTS.

KMACHINE = "aspeed"
KERNEL_DEVICETREE = "aspeed/aspeed-bmc-supermicro-x10sdv-tln4f.dtb"

require conf/machine/include/ast2400.inc
require conf/machine/include/obmc-bsp-common.inc
require conf/machine/include/supermicro.inc

PREFERRED_PROVIDER_virtual/bootloader = "u-boot-aspeed"
PREFERRED_PROVIDER_u-boot = "u-boot-aspeed"
PREFERRED_PROVIDER_u-boot-fw-utils = "u-boot-fw-utils-aspeed"

UBOOT_MACHINE = "ast_g4_ncsi_config"
UBOOT_ENTRYPOINT = "0x40008000"
UBOOT_LOADADDRESS = "0x40008000"

FLASH_SIZE = "32768"

# 32 MiB static flash layout, hand-balanced for this image (rootfs is ~24.7 MiB
# after the iKVM trim, so room is tight; rwfs is small but fine for bring-up):
#   u-boot   0..512        (512 KiB)
#   kernel   512..5248     (4.625 MiB -- 6.18 FIT is ~4.33 MiB, ~0.3 MiB headroom)
#   rofs     5248..31232   (25.375 MiB read-only rootfs, ~0.65 MiB headroom)
#   rwfs     31232..32768  (1.5 MiB read-write overlay)
FLASH_ROFS_OFFSET = "5248"
FLASH_RWFS_OFFSET = "31232"

# Trim features to fit the 32 MiB flash, same approach as the romulus machine.
# obmc-ikvm (video/USB virtual media userspace) is a milestone-2 feature here;
# the DTS still wires &video/&vhub, they just have no consumer yet. Kept in
# IMAGE_FEATURES (not DISTRO_FEATURES) so only image assembly re-runs.
IMAGE_FEATURES:remove = "obmc-ikvm obmc-remote-logging-mgmt"

# Inventory comes from entity-manager (our X10SDV-TLN4F.json), not the static
# skeleton workbook. This is the key M2 flip: it overrides supermicro.inc's weak
# `obmc-inventory-data ?= ${VIRTUAL-RUNTIME_skeleton_workbook}` default, dropping
# the skeleton inventory/control recipes from the image. entity-manager +
# dbus-sensors are already pulled in by packagegroup-supermicro-apps.
VIRTUAL-RUNTIME_obmc-inventory-manager = "entity-manager"
PREFERRED_PROVIDER_virtual/obmc-inventory-data = "entity-manager"

# x86-power-control (an x86 host board daemon, pulled in by
# packagegroup-supermicro-apps) owns xyz.openbmc_project.State.Host and
# .State.Chassis itself -- its Chassis.Control.Power@.service unit declares
# BusName=xyz.openbmc_project.State.Host%i. supermicro.inc enables the
# obmc-host/chassis-state-mgmt MACHINE_FEATUREs but leaves the state-manager
# virtuals at their phosphor-state-manager defaults, so BOTH x86-power-control
# and phosphor-state-manager-host claim State.Host0 -- systemd refuses the
# second ("Two services allocated for the same bus name") and x86-power-control
# fails to start. Point the state-manager virtuals at x86-power-control so
# phosphor-state-manager's host/chassis services aren't installed at all.
# Pattern from meta-intel-openbmc/intel.inc (and s6q / g220a).
VIRTUAL-RUNTIME_obmc-host-state-manager = "x86-power-control"
VIRTUAL-RUNTIME_obmc-chassis-state-manager = "x86-power-control"
VIRTUAL-RUNTIME_obmc-discover-system-state = "x86-power-control"

# AST2400 uses BT for in-band IPMI (the DTS enables &ibt). Override
# supermicro.inc's KCS default (weak ?=) like the q71l AST2400 machine.
PREFERRED_PROVIDER_virtual/obmc-host-ipmi-hw = "phosphor-ipmi-bt"
